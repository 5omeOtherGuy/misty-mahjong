<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f4a"/>
      <stop offset="1" stop-color="#121c20"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6efe0" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#f6efe0" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#f6efe0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f6efe0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="78"/></clipPath>
  </defs>
  <!-- paper disc -->
  <circle cx="100" cy="100" r="78" fill="#f4ecd9"/>
  <g clip-path="url(#circle)">
    <!-- far mountains, pale ink -->
    <path d="M10 128 L48 78 L72 104 L96 66 L124 102 L150 74 L190 128 Z" fill="#8aa0a3" opacity="0.55"/>
    <!-- mist band -->
    <rect x="0" y="112" width="200" height="16" fill="url(#mist)"/>
    <!-- near mountain -->
    <path d="M0 150 L54 92 L82 122 L104 96 L140 142 L200 150 L200 200 L0 200 Z" fill="url(#ink)"/>
    <!-- second mist band -->
    <rect x="0" y="146" width="200" height="12" fill="url(#mist)" opacity="0.85"/>
    <!-- pine on the ridge -->
    <path d="M118 128 l0 -22 M112 112 l6 -8 6 8 M110 120 l8 -10 8 10 M108 128 l10 -12 10 12" stroke="#121c20" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- moon -->
    <circle cx="140" cy="54" r="14" fill="#e9c77a"/>
    <circle cx="146" cy="50" r="12" fill="#f4ecd9"/>
  </g>
  <!-- enso brush ring, open at the top right -->
  <path d="M152 48 A74 74 0 1 1 122 28" fill="none" stroke="#1b2328" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
  <path d="M150 46 A72 72 0 1 1 126 30" fill="none" stroke="#1b2328" stroke-width="3" stroke-linecap="round" opacity="0.5" stroke-dasharray="1 6"/>
  <!-- seal -->
  <rect x="150" y="148" width="22" height="22" rx="3" fill="#b8463b"/>
  <text x="161" y="166" font-family="NebelBrush, serif" font-size="17" fill="#f4ecd9" text-anchor="middle">霧</text>
</svg>
